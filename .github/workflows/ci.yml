name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: investanalytics
          POSTGRES_PASSWORD: investanalytics
          POSTGRES_DB: investanalytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U investanalytics -d investanalytics"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      s3mock:
        image: adobe/s3mock:5.2.0
        ports:
          - 9090:9090
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: investanalytics-raw
          COM_ADOBE_TESTING_S3MOCK_REGION: us-east-1
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://investanalytics:investanalytics@localhost:5432/investanalytics
      RAW_STORAGE_ENDPOINT: http://localhost:9090
      RAW_STORAGE_BUCKET: investanalytics-raw
      RAW_STORAGE_REGION: us-east-1
      RAW_STORAGE_ACCESS_KEY: investanalytics
      RAW_STORAGE_SECRET_KEY: investanalytics
      RAW_STORAGE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Build database schema
        run: alembic upgrade head
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
